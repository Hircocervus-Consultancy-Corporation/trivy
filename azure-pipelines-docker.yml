trigger:
  branches:
    include:
      - hcc-main
      - upstream-v0.69
  paths:
    include:
      - cmd/**
      - pkg/**
      - internal/**
      - go.mod
      - go.sum
      - Dockerfile
      - azure-pipelines-docker.yml

pr:
  branches:
    include:
      - hcc-main

variables:
  - group: docker-registry-credentials
  - name: dockerRegistryServiceConnection
    value: 'hircocervus-acr'
  - name: containerRegistry
    value: 'hircocervuselevate.azurecr.io'
  - name: tag
    value: '$(Build.BuildId)'
  # preint-{buildId} tag consumed by preint-to-dev promotion pipeline
  - name: preintTag
    value: 'preint-$(Build.BuildId)'
  - name: vmImageName
    value: 'ubuntu-latest'

stages:
- stage: Build
  displayName: Build and Push TrivyScanner CV Image
  jobs:
  - job: BuildTrivyScanner
    displayName: Build TrivyScanner CV Image
    pool:
      vmImage: $(vmImageName)
    steps:
    - checkout: self
      fetchDepth: 1

    - task: Docker@2
      displayName: Login to ACR
      inputs:
        command: login
        containerRegistry: $(dockerRegistryServiceConnection)

    - task: Docker@2
      displayName: Build TrivyScanner CV Image
      inputs:
        command: build
        repository: trivy-scanner-cv
        dockerfile: Dockerfile
        containerRegistry: $(dockerRegistryServiceConnection)
        tags: |
          $(tag)
          latest
          $(preintTag)

    - task: Docker@2
      displayName: Push TrivyScanner CV Image
      inputs:
        command: push
        repository: trivy-scanner-cv
        containerRegistry: $(dockerRegistryServiceConnection)
        tags: |
          $(tag)
          latest
          $(preintTag)

- stage: SecurityScan
  displayName: Security Scan (self-scan — Trivy scans itself)
  dependsOn: Build
  jobs:
  - job: TrivySelfScan
    displayName: Trivy Self-Scan
    pool:
      vmImage: $(vmImageName)
    steps:
    - task: Docker@2
      displayName: Login to ACR
      inputs:
        command: login
        containerRegistry: $(dockerRegistryServiceConnection)

    - task: CmdLine@2
      displayName: Install Trivy v0.69.3 and Self-Scan
      inputs:
        script: |
          # Trivy v0.69.3 — Apache 2.0, no license key
          # https://github.com/aquasecurity/trivy/releases/tag/v0.69.3
          curl -sfL https://raw.githubusercontent.com/aquasecurity/trivy/main/contrib/install.sh \
            | sh -s -- -b /usr/local/bin v0.69.3
          trivy image \
            --severity HIGH,CRITICAL \
            --format table \
            --exit-code 1 \
            $(containerRegistry)/trivy-scanner-cv:$(tag)
